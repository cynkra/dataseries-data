name: etl-retry

# Targeted re-fetch passes for the sources the morning ETL skipped. Runs TWICE — lunch
# and afternoon — because each scheduled run gets a FRESH GitHub-runner egress IP, and
# the dominant failure is admin.ch intermittently blocking a *subset* of Azure runner
# IPs (see dev/etl-reliability-log.md). So each pass is an independent fresh-IP draw at
# the handful that failed; the first one to land a clean IP recovers them, and the rest
# no-op. A transient single-host blip (uzh.ch) heals the same way.
#
# Mechanism: the morning run commits data/run.json with its `skipped` list (it now
# COMPLETES with skips rather than cancelling — http.R no longer re-dials dead hosts).
# This job reads it, replays the pipeline pinned to those ids (ETL_MODE=retry ->
# R/pipeline.R retry_skipped()), folds recoveries back into data/ + catalog.json,
# rewrites run.json, logs to data/retry.csv, then runs skip_issues.sh off the rewritten
# run.json.
#
# Alarm ordering: only the LAST pass (afternoon) may OPEN an etl-skip issue; the lunch
# pass runs skip_issues.sh in CLOSE_ONLY mode (closes recovered ones, never opens) —
# because a source still failing at lunch may clear on the afternoon's fresh IP. The
# watchdog (now ~after the afternoon pass) is the final "still no fresh data" backstop.

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = 12:30 CEST  — lunch pass  (CLOSE_ONLY; fresh IP)
    - cron: "15 14 * * *"   # 14:15 UTC = 16:15 CEST  — afternoon pass (opens issues; fresh IP)
  workflow_dispatch:          # manual "Run workflow" button (treated as a final pass: opens)

permissions:
  contents: write   # push recovered data + retry.csv
  issues: write     # open / close the etl-skip issue

concurrency:
  group: etl          # shared with the morning etl run so the two never push concurrently
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Gate: only do work if TODAY's morning run left skips. Requiring run.json's date
      # to equal today (UTC) means a missing/cancelled morning run (stale run.json) is
      # NOT retried here — that hole is the freshness watchdog's job, and retrying stale
      # ids would falsely refresh today's uptime row. On a clean morning (zero skips) or
      # a stale run.json, every step below no-ops via the `retry == 'true'` guard, so the
      # job costs only a checkout.
      - name: Gate on this morning's skips
        id: gate
        run: |
          today="$(date -u +%F)"
          if [[ ! -f data/run.json ]]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "No data/run.json — nothing to retry."; exit 0
          fi
          run_date="$(jq -r '.ts // ""' data/run.json | cut -dT -f1)"
          n_skip="$(jq '.skipped | length' data/run.json)"
          echo "today=${today} run.json date=${run_date} skips=${n_skip}"
          if [[ "$run_date" == "$today" && "$n_skip" -gt 0 ]]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Morning left ${n_skip} skip(s) — running the afternoon retry."
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to retry (clean morning, or run.json not from today)."
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.gate.outputs.retry == 'true'
        with:
          use-public-rspm: true   # P3M Linux binaries — no compilation

      - name: Install R dependencies
        if: steps.gate.outputs.retry == 'true'
        shell: Rscript {0}
        run: |
          install.packages(c(
            "arrow", "dplyr", "httr2", "jsonlite", "readr",
            "readxl", "stringr", "tibble", "tidyr"
          ))

      # Re-fetch only the morning's skips, fold recoveries into data/ + catalog.json,
      # rewrite run.json to the post-retry skip state, append data/retry.csv.
      - name: Retry skipped sources
        if: steps.gate.outputs.retry == 'true'
        run: ETL_MODE=retry Rscript R/pipeline.R

      # Recompute health + uptime so status.json and the uptime row reflect the recovered
      # data (run_through flips green when the afternoon clears every skip). Safe to re-run:
      # health.R overwrites status.json and uptime.R upserts one row per UTC day.
      - name: Recompute data health
        if: steps.gate.outputs.retry == 'true'
        run: Rscript R/health.R

      - name: Recompute uptime metrics
        if: steps.gate.outputs.retry == 'true'
        run: Rscript R/uptime.R

      - name: Commit recovered data + status
        if: steps.gate.outputs.retry == 'true'
        run: |
          git config user.name  "dataseries-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STATUS.md UPTIME.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: retry pass ($(date -u +%F))"
            git push
          fi

      # The alarm. Reads the rewritten data/run.json; never fails the job (an alerting
      # hiccup must not mask a good recovery). The LUNCH pass runs CLOSE_ONLY — it closes
      # recovered issues but does NOT open new ones, since a source still failing now may
      # clear on the afternoon's fresh IP. The AFTERNOON pass (and a manual dispatch, where
      # github.event.schedule is empty) opens an issue for whatever STILL fails — the last
      # fresh-IP attempt of the day.
      - name: Alert on remaining fetch skips
        if: steps.gate.outputs.retry == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSE_ONLY: ${{ github.event.schedule == '30 10 * * *' && '1' || '' }}
        run: bash .github/scripts/skip_issues.sh
