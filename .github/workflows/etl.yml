name: etl

# Daily scrape: re-fetch every source, rewrite data/ + catalog.json, recompute the
# data-health dashboard, and commit the result back. This repo is PUBLIC, so the
# GitHub-hosted runner is free (unmetered) — it consumes no Actions minutes.
#
# The daily commit doubles as the anti-rot heartbeat: GitHub auto-disables a
# scheduled workflow after 60 days of repo inactivity, and committing keeps it alive.

on:
  schedule:
    - cron: "15 8 * * *"    # 08:15 UTC = 09:15 CET (winter) / 10:15 CEST (summer) — just after
                            # the 09:00 Swiss-time release window (SECO/SNB/FSO/KOF). DST-safe:
                            # always fires after 09:00 local. Tune freely.
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write   # push refreshed data
  issues: write     # open a failure issue (anti-rot alert)

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pull Linux package binaries from P3M (no compilation)

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          # Binaries from P3M -> fast, no system-dep compilation. This repo is
          # plain scripts (no DESCRIPTION), so install the list explicitly.
          install.packages(c(
            "arrow", "dplyr", "httr2", "jsonlite", "readr",
            "readxl", "stringr", "tibble", "tidyr"
          ))

      - name: Run ETL
        run: Rscript R/pipeline.R

      - name: Compute data health
        run: Rscript R/health.R

      # Roll the per-dataset board + this run's skip outcome up into the two daily
      # uptime metrics: appends data/uptime.csv, renders UPTIME.md + data/uptime.svg,
      # and owns the README summary block.
      - name: Compute uptime metrics
        run: Rscript R/uptime.R

      - name: Commit refreshed data + status
        run: |
          git config user.name  "dataseries-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STATUS.md UPTIME.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily refresh ($(date -u +%F))"
            git push
          fi

      # Soft alarm: a dataset has gone stale (red on the health board). For each
      # red dataset, open (or refresh) ONE deduped issue labelled `data-health`,
      # and auto-close any data-health issue whose dataset is fresh again. Runs
      # even if the commit step had nothing to push, but never fails the data run
      # — an alerting hiccup must not mask a good refresh.
      - name: Alert on stale datasets
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/health_issues.sh

      # Leading alarm: a source failed to fetch this run (a "skip"). For each skipped
      # dataset open (or refresh) ONE deduped `etl-skip` issue immediately, and close
      # any whose dataset fetched cleanly again. A skip usually means a source changed
      # format — caught here weeks before the data would go stale. Never fails the run.
      - name: Alert on fetch skips
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/skip_issues.sh

      # Hard failure (dep install, R error, ...) => open or update ONE rolling issue,
      # so a broken pipeline can't rot silently. Per-source fetch errors don't reach
      # here (pipeline.R skips a bad source and keeps going) — those open an `etl-skip`
      # issue via the step above and flip the run-through metric red.
      - name: Open / refresh failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily ETL workflow **failed** (run ${context.runId}).`,
              ``,
              `Run log: ${run}`,
              ``,
              `Data files were **not** refreshed this cycle. Investigate the failing step.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "etl-failure", per_page: 1,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: "🔴 Daily ETL run is failing",
                labels: ["etl-failure"], body,
              });
            }
