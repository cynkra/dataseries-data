name: etl

# Daily scrape: re-fetch every source, rewrite data/ + catalog.json, recompute the
# data-health dashboard, and commit the result back. This repo is PUBLIC, so the
# GitHub-hosted runner is free (unmetered) — it consumes no Actions minutes.
#
# The daily commit doubles as the anti-rot heartbeat: GitHub auto-disables a
# scheduled workflow after 60 days of repo inactivity, and committing keeps it alive.

on:
  schedule:
    - cron: "15 8 * * *"    # 08:15 UTC = 09:15 CET (winter) / 10:15 CEST (summer) — just after
                            # the 09:00 Swiss-time release window (SECO/SNB/FSO/KOF). DST-safe:
                            # always fires after 09:00 local. Tune freely.
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write   # push refreshed data
  issues: write     # open a failure issue (anti-rot alert)

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pull Linux package binaries from P3M (no compilation)

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          # Binaries from P3M -> fast, no system-dep compilation. This repo is
          # plain scripts (no DESCRIPTION), so install the list explicitly.
          #
          # digest is used by NOTHING in the pipeline -- only by the datasheet
          # guards (tests/test_description_i18n.R hashes the English description
          # to spot a translation that outlived it). Leaving it out therefore
          # cannot fail the ETL, only the guard step, which reports instead of
          # gating: the symptom is a daily `data-guard` issue reading "there is
          # no package called 'digest'" while every run stays green.
          install.packages(c(
            "arrow", "digest", "dplyr", "httr2", "jsonlite", "readr",
            "readxl", "stringr", "tibble", "tidyr"
          ))

      - name: Run ETL
        run: Rscript R/pipeline.R

      - name: Compute data health
        run: Rscript R/health.R

      # Roll the per-dataset board + this run's skip outcome up into the two daily
      # uptime metrics: appends data/uptime.csv, renders UPTIME.md + data/uptime.svg,
      # and owns the README summary block.
      - name: Compute uptime metrics
        run: Rscript R/uptime.R

      - name: Commit refreshed data + status
        run: |
          git config user.name  "dataseries-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STATUS.md UPTIME.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily refresh ($(date -u +%F))"
            git push
          fi

      # Soft alarm: a datasheet guard is failing. The tests/ suites check what the
      # ETL cannot — a datasheet disagreeing with its generated output, a curated
      # string creeping into the fetch code, a translation outliving the English
      # it was written from. Nothing ran them before this step existed, so a
      # breaking edit stayed unnoticed until somebody ran them by hand.
      #
      # They REPORT, they do not gate: this runs AFTER the commit, so the numbers
      # still publish. A red guard means "a human should look at this", not
      # "ship nothing today" — the data is usually still correct, and it is the
      # curated layer around it that has drifted. One deduped issue per failing
      # suite, labelled `data-guard`, auto-closed when the suite passes again.
      - name: Run datasheet guards (report, don't gate)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/test_issues.sh

      # Soft alarm: a dataset has gone stale (red on the health board). For each
      # red dataset, open (or refresh) ONE deduped issue labelled `data-health`,
      # and auto-close any data-health issue whose dataset is fresh again. Runs
      # even if the commit step had nothing to push, but never fails the data run
      # — an alerting hiccup must not mask a good refresh.
      - name: Alert on stale datasets
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/health_issues.sh

      # Skip alarm, morning half: CLOSE-ONLY. The morning must NOT open an `etl-skip`
      # issue on a fresh skip — it's often a transient single-host blip (uzh.ch /
      # admin.ch connect timeout) that the afternoon retry (etl-retry.yml) clears. So
      # opening is deferred there. But the morning STILL closes the issue of a source
      # that recovered, so a fixed source's issue can't orphan on a day the afternoon
      # retry doesn't run. Reads this run's data/run.json (the afternoon reads it too).
      - name: Close recovered fetch-skip issues
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSE_ONLY: "1"
        run: bash .github/scripts/skip_issues.sh

      # Hard failure (dep install, R error, ...) OR a cancellation — including the
      # job being killed by `timeout-minutes` — => open or update ONE rolling issue,
      # so a broken or STALLED pipeline can't rot silently. `cancelled()` is a third
      # conclusion distinct from failure(): a timeout slips past a bare failure()
      # guard, which is exactly what hid the 2026-06-05 miss. Per-source fetch errors
      # don't reach here (pipeline.R skips a bad source and keeps going) — those open
      # an `etl-skip` issue via the step above and flip the run-through metric red.
      #
      # NOTE: this inline alarm still depends on the dying job getting to run this
      # step. The independent watchdog workflow (.github/workflows/watchdog.yml) is
      # the real backstop — it checks data freshness 2h later from a separate run.
      - name: Open / refresh failure issue
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily ETL workflow did **not complete** (run ${context.runId}) — it failed or was **cancelled** (e.g. it hit \`timeout-minutes\`).`,
              ``,
              `Run log: ${run}`,
              ``,
              `Data files were **not** refreshed this cycle. Investigate the failing or stalled step (a cancellation usually means a source hung and the job timed out).`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "etl-failure", per_page: 1,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: "🔴 Daily ETL run is failing",
                labels: ["etl-failure"], body,
              });
            }
