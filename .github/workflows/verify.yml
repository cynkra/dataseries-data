name: verify

# Weekly end-to-end check that what users receive matches the sources: every
# value of every dataset against its upstream source (verify/upstream, verify/
# reparse with an independent second parser for the hard-to-read files), and the
# published data against the live API and the R and Python packages
# (verify/chain). Reports, does not gate: each `fail`/`error` verdict opens one
# deduplicated issue labelled `data-verify` that closes itself once the check
# passes again. `lag` and `unreachable` show only in the run summary (admin.ch
# hosts sometimes block GitHub's runners; see dev/etl-reliability-log.md).
#
# Monday 10:30 UTC: after the 08:15 daily refresh has committed and the server
# has pulled it at 09:17, so the repo, the live API and the sources line up.

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only checks whose name contains one of these (comma-separated)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verify/requirements.txt

      - name: Install Python dependencies
        run: pip install -r verify/requirements.txt

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the R package from CRAN
        shell: Rscript {0}
        run: install.packages(c("dataseries", "jsonlite"))

      - name: Run all checks
        env:
          ONLY: ${{ inputs.only }}
        run: python verify/run.py ${ONLY:+--only "$ONLY"}

      - name: File or close issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python verify/issues.py

      - name: Keep the detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-out
          path: verify/out
          retention-days: 30
